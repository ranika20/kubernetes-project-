apiVersion: v1
kind: Namespace
metadata:
  name: taskflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
data:
  APP_NAME: "TaskFlow Team"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskflow-data
  namespace: taskflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
    spec:
      containers:
        - name: taskflow
          image: localhost/taskflow:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: PORT
              value: "3000"
            - name: DATA_FILE
              value: "/app/data/tasks.json"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: taskflow-data
              mountPath: /app/data
      volumes:
        - name: taskflow-data
          persistentVolumeClaim:
            claimName: taskflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow
  namespace: taskflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
  namespace: taskflow
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow
                port:
                  name: http
