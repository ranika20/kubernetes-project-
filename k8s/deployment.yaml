apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
    spec:
      containers:
        - name: taskflow
          image: taskflow:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: PORT
              value: "3000"
            - name: DATA_FILE
              value: "/app/data/tasks.json"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: taskflow-data
              mountPath: /app/data
      volumes:
        - name: taskflow-data
          persistentVolumeClaim:
            claimName: taskflow-data
